<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Sent — G&amp;G Carpentry</title>
  <meta name="description" content="Your quote request has been received. G&amp;G Carpentry will be in touch within 24 hours.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks-section {
      min-height: calc(100vh - 220px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }
    .thanks-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .thanks-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: rgba(184, 135, 75, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thanks-icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent);
    }
    .thanks-card h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    .thanks-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .thanks-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="brand">
        <span class="brand-plate">G&amp;G</span>
        <span class="brand-name">G&amp;G Carpentry<small>Professional Trim &amp; Door Hardware</small></span>
      </a>
      <nav class="main-nav" id="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
        </ul>
        <a href="contact.html" class="btn btn-primary">Request a Quote</a>
      </nav>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    </div>
  </header>

  <section class="thanks-section">
    <div class="thanks-card">
      <div class="thanks-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h1>Message Received!</h1>
      <p>Thanks for reaching out. We'll review your request and get back to you at <strong>contact@gandgcarpentry.com</strong> — typically same-day or within 24 hours.</p>
      <div class="thanks-actions">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
        <a href="portfolio.html" class="btn btn-ghost">View Our Work</a>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>

</html>
